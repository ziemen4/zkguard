[package]
name = "zkguard-ligero-host"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
k256 = { version = "0.13.4", features = ["ecdsa"] }
serde_json = "1.0"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
zkguard-ligero-common = { path = "../common" }

[[bin]]
name = "zkguard-ligero-inputs"
path = "src/main.rs"
